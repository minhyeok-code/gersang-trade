# 운영용 모니터링 스택 — 앱 EC2에서 실행한다.
# 운영 앱(docker-compose.prod.yml)이 만든 도커 네트워크에 '외부 네트워크'로 합류해,
# 컨테이너 이름(gersang-trade-app-blue)으로 내부 스크랩한다. → actuator 외부 노출 불필요.
#
# 사용 전 확인:
#   1) 운영 네트워크 이름 확인:  docker network ls   (보통 <프로젝트폴더>_default = gersangtrade_default)
#      다르면 아래 networks.monitoring.name 값을 실제 이름으로 교체.
#   2) 실행:  docker compose -f docker-compose.monitoring.prod.yml up -d
#   3) Grafana는 공개 포트로 열지 말고 SSH 터널로 접속:
#      ssh -i key.pem -L 3001:localhost:3001 ec2-user@<앱EC2>
#      → 브라우저 http://localhost:3001
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: gersang-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver   # k6 결과 remote write 수신
      - --enable-feature=native-histograms
    volumes:
      - ./prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - monitoring
    ports:
      - "127.0.0.1:9090:9090"   # 로컬바인딩 — 외부 비노출 (k6 remote write는 SSH 터널/내부로)
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: gersang-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}   # 운영은 반드시 변경
      GF_AUTH_ANONYMOUS_ENABLED: "false"                                # 운영은 익명 접근 차단
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks:
      - monitoring
    ports:
      - "127.0.0.1:3001:3000"   # 로컬바인딩 — SSH 터널로만 접속
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  grafana-data:
    driver: local

networks:
  monitoring:
    external: true
    name: gersangtrade_default   # ← docker network ls 로 실제 이름 확인 후 필요시 교체
