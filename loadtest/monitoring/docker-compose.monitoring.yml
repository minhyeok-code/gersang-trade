# 부하테스트용 모니터링 스택 (기존 docker-compose와 분리 운용)
# 실행:  docker compose -f docker-compose.monitoring.yml up -d
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: gersang-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver   # k6 결과를 remote write로 수신
      - --enable-feature=native-histograms   # k6 히스토그램(응답시간 분포) 수신
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Linux에서 호스트(앱) 접근 보장
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: gersang-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"   # 프론트(3000)와 충돌 회피 → http://localhost:3001
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  grafana-data:
    driver: local
