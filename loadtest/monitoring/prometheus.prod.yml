# 운영용 Prometheus 수집 설정
# 앱 컨테이너를 '컨테이너 이름'으로 내부 스크랩한다 (actuator를 외부/nginx에 노출하지 않음).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # 운영 앱 — 블루-그린 양쪽을 모두 스크랩한다.
  # 배포할 때마다 활성 슬롯이 blue↔green으로 바뀌므로, 둘 다 등록해두면
  # 활성 슬롯은 항상 UP으로 잡히고 비활성 슬롯만 DOWN으로 뜬다(정상, 무시).
  - job_name: 'gersang-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['gersang-trade-app-blue:8080']
        labels: { application: 'gersang-trade', slot: 'blue' }
      - targets: ['gersang-trade-app-green:8080']
        labels: { application: 'gersang-trade', slot: 'green' }

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
