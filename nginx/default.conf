# 활성 슬롯(blue/green)은 upstream.conf에 정의됨 — nginx가 conf.d/*.conf를 자동 로드하므로
# 여기서 별도 include하면 upstream이 중복 정의되어 기동 실패한다(명시적 include 금지)
#
# location 블록은 /etc/nginx/snippets/locations.conf 로 분리 — 80/443 두 server에서 공유

upstream nextjs {
    server front:3000;
}

# ── HTTP(80) ───────────────────────────────────────────────────────────────
# Cloudflare 프록시 뒤에서 사용. 외부의 http→https 업그레이드는 Cloudflare "Always Use HTTPS"가
# 엣지에서 처리하므로 여기서 80→443 강제 리다이렉트하지 않는다.
# (front 컨테이너가 http://nginx 로 내부 호출하므로 80을 그대로 살려둬야 SSR/프록시가 깨지지 않음)
server {
    listen 80;
    server_name _;

    include /etc/nginx/snippets/locations.conf;
}

# ── HTTPS(443) ───────────────────────────────────────────────────────────────
# 인증서는 Cloudflare Origin Certificate 를 호스트에 저장 후 볼륨 마운트
# (docker-compose.prod.yml 의 nginx.volumes 참고). Cloudflare SSL/TLS 모드는 Full(strict).
server {
    listen 443 ssl;
    server_name gersangin.app;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/locations.conf;
}
