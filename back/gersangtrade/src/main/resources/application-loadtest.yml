# 부하테스트 전용 프로필 — 로깅만 최소화한다.
# 사용법: 활성 프로필을 'local,loadtest'로 지정하면
#   local의 DB·보안 설정은 그대로 쓰고, 아래 로깅 설정이 local의 DEBUG/TRACE를 덮어쓴다.
# (프로필은 나중에 오는 것이 우선이므로 반드시 local 뒤에 loadtest를 둔다)
logging:
  level:
    root: INFO
    org.example.gersangtrade: INFO
    org.hibernate.SQL: WARN            # 실행 SQL 출력 끔 (부하 시 성능·안정성 치명적)
    org.hibernate.orm.jdbc.bind: WARN  # 바인딩 파라미터 출력 끔
    org.springframework.security: WARN
    org.springframework.web.socket: WARN
    org.springframework.messaging.simp: WARN
