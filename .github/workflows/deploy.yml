name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: EC2 블루-그린 배포
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_S3_BASE_URL: ${{ secrets.AWS_S3_BASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OAUTH2_REDIRECT_URI: ${{ secrets.OAUTH2_REDIRECT_URI }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: DB_URL,DB_USERNAME,DB_PASSWORD,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,NAVER_CLIENT_ID,NAVER_CLIENT_SECRET,AWS_REGION,AWS_S3_BUCKET,AWS_S3_BASE_URL,JWT_SECRET,OAUTH2_REDIRECT_URI
          script: |
            set -e
            cd "${{ secrets.REMOTE_DIR }}"

            # 1. GitHub Secrets → .env 파일 생성 (매 배포마다 덮어씀)
            cat > .env << ENV
            DB_URL=${DB_URL}
            DB_USERNAME=${DB_USERNAME}
            DB_PASSWORD=${DB_PASSWORD}
            DDL_AUTO=validate
            FLYWAY_ENABLED=true
            BATCH_SCHEMA_INIT=never
            GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
            GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
            NAVER_CLIENT_ID=${NAVER_CLIENT_ID}
            NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET}
            AWS_REGION=${AWS_REGION}
            AWS_S3_BUCKET=${AWS_S3_BUCKET}
            AWS_S3_BASE_URL=${AWS_S3_BASE_URL}
            JWT_SECRET=${JWT_SECRET}
            OAUTH2_REDIRECT_URI=${OAUTH2_REDIRECT_URI}
            COOKIE_SECURE=true
            ENV

            # 2. 최신 코드 반영 (서버 로컬 변경을 무시하고 항상 원격 main 기준으로 강제 정렬)
            #    배포 서버 작업트리는 언제든 버려도 되는 것으로 취급 — 서버에서 파일을 직접 수정해도
            #    'git pull' 충돌로 배포가 막히지 않는다. (.env·.active-slot은 git 미추적이라 보존됨)
            echo "[원격] git fetch + reset --hard..."
            git fetch origin main
            git reset --hard origin/main

            # 3. 현재/다음 슬롯 결정
            ACTIVE=$(cat .active-slot 2>/dev/null || echo "blue")
            NEXT=$([ "$ACTIVE" = "blue" ] && echo "green" || echo "blue")
            echo "[원격] 현재=$ACTIVE → 다음=$NEXT"

            COMPOSE="docker compose -f docker-compose.prod.yml"

            # 4. 새 슬롯 빌드·시작
            if [ "$NEXT" = "green" ]; then
              $COMPOSE --profile green up -d --build app-green
            else
              $COMPOSE up -d --build app-blue
            fi

            # 5. 헬스체크 (최대 2분, 5초 간격)
            echo "[원격] app-$NEXT 헬스체크 대기 중..."
            for i in $(seq 1 24); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' "gersang-trade-app-$NEXT" 2>/dev/null || echo "")
              if [ "$STATUS" = "healthy" ]; then
                echo "[원격] app-$NEXT healthy 확인"
                break
              fi
              if [ "$i" -eq 24 ]; then
                echo "[error] 헬스체크 실패 — 롤백"
                $COMPOSE stop "app-$NEXT" 2>/dev/null || true
                exit 1
              fi
              echo "  대기 중... ($i/24, 상태: ${STATUS:-starting})"
              sleep 5
            done

            # 6. nginx upstream 전환 (무중단)
            #    상시 서비스(db/front/nginx)를 먼저 보장 — 최초 배포/재기동 시에도 nginx가 뜨도록
            echo "upstream spring_boot { server app-$NEXT:8080; }" > nginx/upstream.conf
            $COMPOSE up -d mysql front nginx
            $COMPOSE exec nginx nginx -s reload || true
            echo "[원격] nginx → app-$NEXT 전환 완료"

            # 7. 이전 슬롯 종료
            $COMPOSE stop "app-$ACTIVE"

            echo "$NEXT" > .active-slot
            echo "[원격] 배포 완료. active=$NEXT"
